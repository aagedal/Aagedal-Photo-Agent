name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Clean build and unfiltered tests
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository validation gates
        env:
          CI_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: scripts/ci/validate_repository.sh

      - name: Clean build for testing
        env:
          DERIVED_DATA: ${{ runner.temp }}/AagedalPhotoAgentDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project 'Aagedal Photo Agent.xcodeproj' \
            -scheme 'Aagedal Photo Agent Tests' \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            clean build-for-testing \
            | tee "$RUNNER_TEMP/build-for-testing.log"

      - name: Run all tests without rebuilding
        env:
          DERIVED_DATA: ${{ runner.temp }}/AagedalPhotoAgentDerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/AagedalPhotoAgentTests.xcresult
        run: |
          set -o pipefail
          xcodebuild \
            -project 'Aagedal Photo Agent.xcodeproj' \
            -scheme 'Aagedal Photo Agent Tests' \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            test-without-building \
            | tee "$RUNNER_TEMP/test-without-building.log"

      - name: Write concise failure summary
        if: failure()
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/AagedalPhotoAgentTests.xcresult
        run: |
          {
            echo '## macOS CI failure'
            echo
            python3 scripts/ci/summarize_xcresult.py "$RESULT_BUNDLE" || true
            echo
            echo 'The complete build/test logs and test result bundle are attached to this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-ci-failure-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/AagedalPhotoAgentTests.xcresult
            ${{ runner.temp }}/build-for-testing.log
            ${{ runner.temp }}/test-without-building.log
