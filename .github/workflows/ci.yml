name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local builds/tests validate PR code before pushing. Keep the remote PR check
  # quick; main and manual runs retain the complete clean-build/test coverage.
  repository-validation:
    name: Repository validation
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository validation gates
        env:
          CI_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: scripts/ci/validate_repository.sh

  build-and-test:
    name: Clean build and unfiltered tests
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: repository-validation
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record toolchain identity
        run: |
          sw_vers
          xcodebuild -version

      # Main now requires the ignored AuraFace package in every app build.
      # Reproduce its reviewed bytes from the immutable source instead of skipping
      # model validation or depending on a developer's local checkout.
      - name: Install pinned model reproduction tools
        run: |
          python3 -m venv "$RUNNER_TEMP/model-tools"
          "$RUNNER_TEMP/model-tools/bin/pip" install uv==0.11.19 huggingface_hub==1.27.0
          echo "$RUNNER_TEMP/model-tools/bin" >> "$GITHUB_PATH"

      - name: Reproduce and verify required AuraFace model
        run: |
          set -o pipefail
          {
            python3 scripts/fetch_auraface_source.py fetch
            uv sync --frozen --project scripts/auraface
            PYTHONHASHSEED=0 uv run --frozen --project scripts/auraface \
              python scripts/build_auraface_coreml.py reproduce
            ditto build/auraface/AuraFaceR100.mlpackage \
              'Aagedal Photo Agent/Resources/Models/AuraFaceR100.mlpackage'
            python3 -B scripts/build_auraface_coreml.py verify
          } | tee "$RUNNER_TEMP/model-reproduction.log"

      # CI uses ad-hoc signing; distribution and authenticated helper qualification
      # require the separately signed release candidate. Restricted iCloud
      # entitlements cannot launch under an ad-hoc signature without a profile.
      - name: Clean build for testing
        env:
          DERIVED_DATA: ${{ runner.temp }}/AagedalPhotoAgentDerivedData
        run: |
          set -o pipefail
          xcodebuild \
            -project 'Aagedal Photo Agent.xcodeproj' \
            -scheme 'Aagedal Photo Agent Tests' \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= \
            clean build-for-testing \
            | tee "$RUNNER_TEMP/build-for-testing.log"

      - name: Run all tests without rebuilding
        env:
          DERIVED_DATA: ${{ runner.temp }}/AagedalPhotoAgentDerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/AagedalPhotoAgentTests.xcresult
        run: |
          set -o pipefail
          xcodebuild \
            -project 'Aagedal Photo Agent.xcodeproj' \
            -scheme 'Aagedal Photo Agent Tests' \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= \
            test-without-building \
            | tee "$RUNNER_TEMP/test-without-building.log"

      - name: Write concise failure summary
        if: failure()
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/AagedalPhotoAgentTests.xcresult
        run: |
          {
            echo '## macOS CI failure'
            echo
            python3 scripts/ci/summarize_xcresult.py "$RESULT_BUNDLE" || true
            echo
            echo 'The complete build/test logs and test result bundle are attached to this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-ci-failure-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/AagedalPhotoAgentTests.xcresult
            ${{ runner.temp }}/model-reproduction.log
            ${{ runner.temp }}/build-for-testing.log
            ${{ runner.temp }}/test-without-building.log
